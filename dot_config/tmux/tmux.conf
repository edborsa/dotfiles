
set  -g default-terminal "screen-256color"
set  -g base-index      1
setw -g pane-base-index 1





set -g status-keys vi
set -g mode-keys   vi



# rebind main key: C-s
unbind C-b
set -g prefix C-s
bind -N "Send the prefix key through to the application" \
  C-s send-prefix




set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  24
set  -s escape-time       1
set  -g history-limit     2000

# ============================================= #
# Plugins (chezmoi externals, see .chezmoiexternal.toml)
# --------------------------------------------- #

run-shell ~/.config/tmux/plugins/sensible/sensible.tmux
run-shell ~/.config/tmux/plugins/resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/yank/yank.tmux

# ============================================= #

unbind C-b
setw -g pane-base-index 1
set-option -g focus-events on
set-option -sa terminal-features ',xterm-ghostty:RGB,xterm-ghostty:extkeys'
set -g extended-keys on
set-option -sa terminal-overrides ',screen-256color:RGB'
set -g repeat-time 1000
setw -g monitor-activity on
setw -g visual-activity off
set-option -g bell-action none
set -g renumber-windows on

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M; send-keys M; send-keys M' 'select-pane -t=; copy-mode -e; send-keys -M'"

is_vim='echo "#{pane_current_command}" | grep -iqE "(^|/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

unbind C-p
bind C-p paste-buffer
bind C-l send-keys 'C-l'
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

bind -n S-Left  resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down  resize-pane -D 1
bind -n S-Up    resize-pane -U 1

bind -n C-Left  resize-pane -L 10
bind -n C-Right resize-pane -R 10
bind -n C-Down  resize-pane -D 5
bind -n C-Up    resize-pane -U 5

bind c new-window -c "#{pane_current_path}"
bind -n M-u previous-window
bind -n M-i next-window
bind C-space last-window
unbind r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"
bind C-j split-window -v -c "#{pane_current_path}" "$HOME/.local/bin/tmux-sessionizer"
bind Escape copy-mode
bind C-b send-keys 'tat && exit' 'C-m'
bind K run-shell 'tmux switch-client -n \; kill-session -t "$(tmux display-message -p "#S")" || tmux kill-session'

set -g status on
set -g status-interval 30
set -g status-right-length 80
